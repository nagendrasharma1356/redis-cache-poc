spring.application.name=redis-cache-poc
server.port=8080

# ---------- H2 (in-memory) ----------
spring.datasource.url=jdbc:h2:mem:redisdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=always

# ---------- Redis ----------
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
spring.data.redis.repositories.enabled=false
spring.cache.type=redis

# ---------- App settings ----------
# Simulates a slow database call so cache hits are easy to notice (milliseconds)
app.simulated-latency-ms=2000
# Time-to-live of cached entries (minutes)
app.cache.product-ttl-minutes=10
app.cache.product-list-ttl-minutes=2

logging.level.com.example.rediscache=INFO
