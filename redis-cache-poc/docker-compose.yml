services:
  redis:
    image: redis:7-alpine
    container_name: redis-cache-poc
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]

  # Optional web UI to look at the cached keys: http://localhost:8081
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander-poc
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
